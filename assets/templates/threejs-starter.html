<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Puffy Planet — Pro 3D Animator starter (Three.js)</title>
<style>
  html, body { margin: 0; height: 100%; background: #FFF6EC; overflow: hidden; }
  #app { position: fixed; inset: 0; }
  #hud { position: fixed; left: 12px; bottom: 12px; display: flex; gap: 10px; align-items: center;
         font: 12px/1.5 system-ui, sans-serif; color: #5B4B49; background: #ffffffd9;
         border-radius: 16px; padding: 8px 14px; box-shadow: 0 4px 14px #00000012; }
  #hud button { border: 0; border-radius: 999px; padding: 7px 14px; font-weight: 700;
                background: #FFADAD; color: #5B2530; cursor: pointer; }
  #hud button:hover { filter: brightness(1.05); }
  .hide { display: none !important; }
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <span><b>Puffy Planet</b> · 8&nbsp;s perfect loop · determinstic frames: <code>?still=1&amp;t=1.0</code> · style bible: Puffy</span>
  <button id="rec">⏺ Record 8 s (WebM + audio)</button>
</div>

<!-- ════════════════════════════════════════════════════════════════════════
  PRO 3D ANIMATOR — Path A starter (Three.js r160+, single file, no build step)

  What this template demonstrates (all rules from the skill, applied):
    • Puffy/Bubbly style bible: rounded-everything geometry, pastel palette,
      MeshPhysicalMaterial with clearcoat+sheen, soft three-point rig
    • Stateless loop-safe timeline: pose(t) is a pure function of loop time —
      every one-shot gag ends settled before the seam, all ambient motion uses
      sines whose period divides the loop length
    • The animation trio on every action: anticipation → squash&stretch → settle
    • Volume-preserving squash: scale.y = s  ⇒  scale.xz = 1/√s
    • Deterministic frame mode (?still=1&t=SEC + window.__seek) for headless
      MP4/GIF rendering via examples/render-frames.mjs
    • One-click WebM recording WITH synchronized synthesized audio
═══════════════════════════════════════════════════════════════════════════ -->

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ── 0 · SPEC (intake result lives here; URL params override for rendering) ── */
const SPEC = { width: 960, height: 540, fps: 30, loop: 8 };       // 1920x1080 for delivery
const Q    = new URLSearchParams(location.search);
if (Q.get('res'))  { const [w, h] = Q.get('res').split('x').map(Number); SPEC.width = w; SPEC.height = h; }
if (Q.get('loop')) SPEC.loop = parseFloat(Q.get('loop'));
const LOOP = SPEC.loop;
const TUNE = { speed: parseFloat(Q.get('speed') ?? 1), squash: 1, cameraDrift: 1 }; // user-facing knobs
const STILL = Q.get('still') !== null;
const stillT = STILL ? parseFloat(Q.get('t') ?? '0') : 0;

/* ── 1 · Renderer / scene / camera (settings from pipeline-threejs.md §2) ── */
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(STILL ? 1 : Math.min(devicePixelRatio, 2));
renderer.setSize(SPEC.width, SPEC.height);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#FFF6EC');
scene.fog = new THREE.Fog('#FFF6EC', 20, 46);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(34, SPEC.width / SPEC.height, 0.1, 120);
const TARGET = new THREE.Vector3(0, 0.9, 0);

/* ── 2 · Lighting — soft-box rig (art-styles.md §1) ── */
scene.add(new THREE.HemisphereLight('#FFF3E0', '#FFD9E0', 0.55));
const key = new THREE.DirectionalLight('#FFFFFF', 1.6);
key.position.set(6, 9, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -11, right: 11, top: 11, bottom: -11, near: 1, far: 40 });
key.shadow.camera.updateProjectionMatrix();
key.shadow.bias = -0.0002; key.shadow.normalBias = 0.02;
scene.add(key);
const fill = new THREE.DirectionalLight('#CFE3FF', 0.5); fill.position.set(-7, 4, -2); scene.add(fill);
const rim  = new THREE.DirectionalLight('#FFD1DC', 0.7); rim.position.set(-2, 6, -8);  scene.add(rim);

/* ── 3 · Style helpers (no raw materials anywhere — everything through these) ── */
const puffyMat = (color, extra = {}) => new THREE.MeshPhysicalMaterial({
  color, roughness: 0.42, clearcoat: 0.5, clearcoatRoughness: 0.5,
  sheen: 0.4, sheenColor: new THREE.Color('#FFFFFF'), ...extra,
});

/* Volume-preserving squash — origin must sit at the contact point (see below) */
function squash(mesh, s) { const r = 1 / Math.sqrt(s); mesh.scale.set(r, s, r); }

/* ── 4 · Set dressing (all positions/constants deterministic — no Math.random) ── */
const slab = new THREE.Mesh(new RoundedBoxGeometry(15, 1.8, 12, 6, 0.9), puffyMat('#B7E4C7'));
slab.position.y = -0.9; slab.receiveShadow = true; slab.castShadow = true;
scene.add(slab);

const dome = new THREE.Mesh(new THREE.SphereGeometry(5, 48, 32), puffyMat('#95D5B2'));
dome.scale.set(1, 0.5, 0.85); dome.position.y = -2.6; scene.add(dome);      // puffy island underside

for (const [x, z, r, c] of [[-3.4, 1.4, 1.3, '#A5D8C3'], [2.9, -2.5, 1.0, '#A5D8C3'], [3.6, 2.2, 0.8, '#A5D8C3']]) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 40, 28), puffyMat(c));
  m.scale.y = 0.42; m.position.set(x, -0.18, z); m.receiveShadow = true; scene.add(m);
}

function makeTree(x, z, s, rotY) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CapsuleGeometry(0.18, 0.7, 8, 20), puffyMat('#B08968'));
  trunk.position.y = 0.55; trunk.castShadow = true; g.add(trunk);
  const cm = puffyMat('#74C69D');
  for (const [cx, cy, r] of [[0, 1.35, 0.62], [0.38, 1.08, 0.42], [-0.36, 1.14, 0.44], [0.04, 1.66, 0.4]]) {
    const c = new THREE.Mesh(new THREE.SphereGeometry(r, 32, 24), cm);
    c.position.set(cx, cy, 0); c.castShadow = true; g.add(c);
  }
  g.scale.setScalar(s); g.rotation.y = rotY; g.position.set(x, 0, z); scene.add(g);
}
makeTree(-4.6, -2.6, 1.15, 0.6); makeTree(4.8, -1.6, 0.9, 2.2); makeTree(-3.9, 3.4, 0.75, 1.1);

const bushM = puffyMat('#8FD6B1');
for (const [x, z, s] of [[0.6, 3.6, 1], [-1.6, 3.9, 0.7], [5.4, 1.2, 0.8], [-5.9, 0.4, 0.9]]) {
  const b = new THREE.Group();
  for (const [dx, dy, r] of [[0, 0, 0.42], [0.34, -0.05, 0.3], [-0.3, -0.06, 0.32]]) {
    const p = new THREE.Mesh(new THREE.SphereGeometry(r, 24, 16), bushM);
    p.position.set(dx, dy, 0); p.castShadow = true; b.add(p);
  }
  b.scale.setScalar(s); b.position.set(x, 0.12, z); scene.add(b);
}

const stemM = puffyMat('#6BBF8E'), petalM = puffyMat('#E8639B'), heartM = puffyMat('#FFD166');
for (const [x, z, c] of [[1.6, 2.9, petalM], [2.2, 3.4, heartM], [-2.6, -0.6, petalM], [4.2, -0.2, heartM]]) {
  const f = new THREE.Group();
  const stem = new THREE.Mesh(new THREE.CapsuleGeometry(0.03, 0.22, 6, 10), stemM);
  stem.position.y = 0.11; f.add(stem);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.09, 16, 12), c);
  head.position.y = 0.28; f.add(head);
  f.position.set(x, 0, z); scene.add(f);
}

for (const [x, z, r] of [[-1.2, 3.0, 0.04], [-2.2, 2.4, 0.04], [0.4, 4.3, 0.04], [1.9, 3.9, 0.04], [-4.9, 2.2, 0.04]]) {
  const g = new THREE.Mesh(new THREE.CapsuleGeometry(0.032, 0.16, 6, 8), stemM);
  g.position.set(x, 0.1, z); g.rotation.z = 0.12 * Math.sin(x * 3.1); scene.add(g);
}

const clouds = [];
for (const [x, y, z, s, ph] of [[-5.5, 4.6, -4, 1.3, 0], [4.6, 5.6, -6, 1.7, 2.1], [-1.5, 6.4, -10, 2.1, 4.2], [7.5, 3.8, -2, 0.9, 1.2]]) {
  const g = new THREE.Group(); const cm = new THREE.MeshStandardMaterial({ color: '#FFFFFF', roughness: 0.65 });
  for (const [dx, dy, r] of [[0, 0, 0.75], [0.7, -0.08, 0.55], [-0.7, -0.1, 0.6], [0.2, 0.28, 0.55], [-0.25, 0.3, 0.5]]) {
    const p = new THREE.Mesh(new THREE.SphereGeometry(r, 24, 16), cm); p.position.set(dx, dy, 0); g.add(p);
  }
  g.scale.setScalar(s); g.position.set(x, y, z); scene.add(g);
  clouds.push({ g, x, y, z, ph });
}

const floaters = [];
for (const [x, y, z, r, c, ph] of [[-11, 4.5, -14, 1.0, '#FFADAD', 0], [10, 6.5, -17, 1.4, '#A3C9F9', 2], [-6, 8.5, -20, 0.8, '#FDFFB6', 4], [13, 3, -12, 0.6, '#B7E4C7', 1]]) {
  const f = new THREE.Mesh(new THREE.SphereGeometry(r, 32, 24), puffyMat(c));
  f.position.set(x, y, z); scene.add(f); floaters.push({ f, y, ph });
}

/* ── 5 · Characters — origin at the contact point so squash reads correctly ── */
function makeBlob(color, x, z, phase) {
  const g = new THREE.Group();
  const geo = new THREE.SphereGeometry(0.9, 48, 32); geo.translate(0, 0.9, 0);   // base-origin!
  const body = new THREE.Mesh(geo, puffyMat(color));
  body.castShadow = true; body.receiveShadow = true; g.add(body);

  const white = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.25 });
  const pupil = new THREE.MeshStandardMaterial({ color: '#2B2320', roughness: 0.3 });
  const eyes = new THREE.Group();
  for (const ex of [-0.28, 0.28]) {
    const e = new THREE.Mesh(new THREE.SphereGeometry(0.15, 24, 16), white);
    e.position.set(ex, 1.22, 0.76);                       // eyes at 60% up the head
    const p = new THREE.Mesh(new THREE.SphereGeometry(0.07, 16, 12), pupil);
    p.position.set(0, 0.01, 0.115); e.add(p);
    eyes.add(e);
  }
  body.add(eyes);
  const cheekM = new THREE.MeshStandardMaterial({ color: '#FF9EB5', roughness: 0.5, transparent: true, opacity: 0.75 });
  for (const cx of [-0.5, 0.5]) {
    const c = new THREE.Mesh(new THREE.SphereGeometry(0.11, 16, 12), cheekM);
    c.position.set(cx, 0.94, 0.72); c.scale.set(1.4, 0.8, 0.5); body.add(c);
  }
  g.position.set(x, 0, z); scene.add(g);
  return { g, body, eyes, phase, x, z };
}
const blobs = [
  makeBlob('#FFADAD', -2.4,  0.6, 0.0),   // hero (hops)
  makeBlob('#FFD6A5',  1.5, -1.8, 0.4),   // spinner
  makeBlob('#A3C9F9',  3.3,  0.9, 0.8),   // shy one
];

/* ── 6 · Easing library (animation-principles.md §3) ── */
const clamp01 = x => Math.min(1, Math.max(0, x));
const lerp = (a, b, p) => a + (b - a) * p;
const seg  = (t, a, b, e = easeInOutCubic) => b > a ? e(clamp01((t - a) / (b - a))) : 1;
function easeInOutCubic(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
function easeOutCubic(x)   { return 1 - Math.pow(1 - x, 3); }
function easeInOutQuint(x) { return x < 0.5 ? 16 * x ** 5 : 1 - Math.pow(-2 * x + 2, 5) / 2; }
function easeOutBack(x, s = 1.70158) { return 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); }

/* ── 7 · pose(t) — the entire animation, stateless & loop-safe ── */
function blinkAmt(t, off) {
  for (const w0 of [2.6, 6.35]) {
    const close = seg(t, w0 + off, w0 + off + 0.05, easeOutCubic);
    const open  = 1 - seg(t, w0 + off + 0.08, w0 + off + 0.13, easeOutCubic);
    const k = close * open;
    if (k > 0.001) return k;
  }
  return 0;
}

function pose(t) {
  /* ambient life — sines only, every period divides LOOP (loop-safe by construction) */
  for (const c of clouds) {
    c.g.position.x = c.x + 0.5 * Math.sin(2 * Math.PI * t / 8 + c.ph);
    c.g.position.y = c.y + 0.15 * Math.sin(2 * Math.PI * t / 4 + c.ph * 1.7);
  }
  for (const fl of floaters) fl.f.position.y = fl.y + 0.25 * Math.sin(2 * Math.PI * t / 8 + fl.ph);

  const [A, B, C] = blobs;

  /* hero hop — anticipation → flight(stretch) → impact(squash) → settle(overshoot) */
  let sA = 1, yA = 0, rA = 0;
  if (t < 0.75) {                                   // wind-up: squash 22% (4→0.75 s)
    sA = 1 - 0.22 * seg(t, 0.50, 0.75);
  } else if (t < 1.35) {                            // flight: parabola + stretch
    const p = seg(t, 0.75, 1.35, x => x);
    yA  = 2.3 * Math.sin(Math.PI * p);
    sA  = 1 + 0.22 * Math.sin(Math.PI * p);
    rA  = 0.10 * Math.sin(Math.PI * p);
  } else if (t < 1.47) {                            // impact: squash 25%
    sA = 1 - 0.25 * seg(t, 1.35, 1.47, easeOutCubic);
  } else {                                          // settle: overshoot then rest
    sA = 0.75 + 0.25 * seg(t, 1.47, 2.10, easeOutBack);
  }
  A.g.position.y = yA; A.g.rotation.z = rA;

  /* blob B: excited 360° spin with a squash pulse */
  B.g.rotation.y = (t >= 3.2 && t < 4.4) ? Math.PI * 2 * seg(t, 3.2, 4.4, easeInOutQuint) : 0;

  /* blob C: shy shrink, then a bouncy pop back */
  let kC = 1;
  if (t >= 5.0 && t < 5.7)       kC = 1 - 0.15 * seg(t, 5.0, 5.5);
  else if (t >= 5.7 && t < 6.3)  kC = 0.85 + 0.15 * seg(t, 5.7, 6.3, easeOutBack);
  C.g.scale.setScalar(kC);

  /* secondary motion: breathing (period 2 s) + blinking — every blob, always */
  for (const b of blobs) {
    const breath = 1 + 0.015 * Math.sin(2 * Math.PI * t / 2 + b.phase * 2);
    b.eyes.scale.y = 1 - 0.88 * blinkAmt(t, b.phase * 0.33);
    squash(b.body, (b === A ? sA : 1) * TUNE.squash * breath);
  }

  /* camera: gentle drift — all sines with period LOOP (seam-free) */
  const az = 0.10 * Math.sin(2 * Math.PI * t / LOOP) * TUNE.cameraDrift;
  const r  = 17 + 0.35 * Math.sin(2 * Math.PI * t / LOOP + Math.PI / 2) * TUNE.cameraDrift;
  camera.position.setFromSpherical(new THREE.Spherical(r, Math.PI / 2 - 0.34, az)).add(TARGET);
  camera.lookAt(TARGET);
}

/* ── 8 · Sound kit (compact version of sound-design.md §2) ── */
let actx = null, master = null, recDest = null;
function ensureAudio() {
  if (!actx) {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = 0.9;
    const comp = actx.createDynamicsCompressor();
    master.connect(comp); comp.connect(actx.destination);
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(type, f0, f1, dur, vol, t0 = 0) {
  const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + t0;
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur * 0.9);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.03);
}
const sfx = {
  pop()    { tone('sine', 520, 150, 0.12, 0.5); },
  thud()   { tone('sine', 95, 45, 0.2, 0.7); },
  boing()  { tone('triangle', 300, 80, 0.3, 0.4); },
  pluck(f) { tone('triangle', f, f, 0.35, 0.35); },
  sparkle(){ [2093, 2637, 3520].forEach((f, i) => setTimeout(() => ensureAudio() && tone('sine', f, f, 0.25, 0.12), i * 50)); },
};

/* cues in loop-local time (sound-design.md §1): whoosh leads, impact lands on contact */
const CUES = [
  { t: 0.50, fn: () => sfx.pluck(392) },
  { t: 0.75, fn: () => sfx.pop() },
  { t: 1.35, fn: () => { sfx.thud(); sfx.boing(); } },
  { t: 3.20, fn: () => sfx.sparkle() },
  { t: 4.40, fn: () => sfx.pluck(523) },
  { t: 5.70, fn: () => sfx.pop() },
];
let lastT = -1;
function fireCues(loopT) {
  if (loopT < lastT) lastT = -1;
  for (const c of CUES) if (lastT < c.t && c.t <= loopT) c.fn();
  lastT = loopT;
}

/* ── 9 · Deterministic seek (headless rendering contract: examples/render-frames.mjs) ── */
window.__seek = t => { pose(t % LOOP); renderer.render(scene, camera); };

/* ── 10 · Modes: single frame / live loop ── */
if (STILL) {
  document.getElementById('hud').classList.add('hide');
  requestAnimationFrame(() => { window.__seek(stillT); window.__ready = true; });  // env + first frame settled
} else {
  const clock = new THREE.Clock();
  renderer.setAnimationLoop(() => {
    const t = (clock.getElapsedTime() * TUNE.speed) % LOOP;
    pose(t);
    if (actx) fireCues(t);
    renderer.render(scene, camera);
    window.__ready = true;
  });

  /* one-click recording: video + synthesized audio in one pass */
  document.getElementById('rec').addEventListener('click', () => {
    ensureAudio();
    const stream = renderer.domElement.captureStream(SPEC.fps);
    recDest = actx.createMediaStreamDestination();
    master.connect(recDest);
    recDest.stream.getAudioTracks().forEach(tr => stream.addTrack(tr));
    const chunks = [];
    const rec = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9', videoBitsPerSecond: 12_000_000 });
    rec.ondataavailable = e => chunks.push(e.data);
    rec.onstop = () => {
      const url = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
      const a = Object.assign(document.createElement('a'), { href: url, download: 'puffy-planet_960x540_30fps_8s_puffy.webm' });
      a.click(); URL.revokeObjectURL(url);
    };
    clock.stop(); clock.start(); lastT = -1;       // restart the loop so recording covers a full cycle
    rec.start();
    setTimeout(() => rec.stop(), LOOP * 1000 / TUNE.speed);
  });
}
</script>
</body>
</html>
